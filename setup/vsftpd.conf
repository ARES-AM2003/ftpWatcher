# vsftpd configuration for chrooted FTP server
# High-performance, secure FTP server configuration

# Basic Settings
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# Chroot Configuration
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

# User Directory Configuration
# Users will be chrooted to their home directory
# Structure: /ftp_root/username_userid/
user_sub_token=$USER
local_root=/ftp_root/$USER

# Passive Mode Configuration (for firewall compatibility)
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=0.0.0.0

# Performance Tuning
use_localtime=YES
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES
connect_from_port_20=YES

# Security Settings
hide_ids=YES
ls_recurse_enable=NO
ascii_upload_enable=NO
ascii_download_enable=NO

# Connection Limits
max_clients=200
max_per_ip=10

# Timeout Settings
idle_session_timeout=600
data_connection_timeout=120

# SSL/TLS (optional - uncomment to enable)
# ssl_enable=YES
# rsa_cert_file=/etc/ssl/certs/vsftpd.pem
# rsa_private_key_file=/etc/ssl/private/vsftpd.key
# allow_anon_ssl=NO
# force_local_data_ssl=YES
# force_local_logins_ssl=YES
# ssl_tlsv1=YES
# ssl_sslv2=NO
# ssl_sslv3=NO

# Logging
log_ftp_protocol=YES
syslog_enable=NO

# Virtual Users (optional)
# guest_enable=YES
# guest_username=ftp
# pam_service_name=vsftpd_virtual
